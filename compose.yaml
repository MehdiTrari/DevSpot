
services:
  reverse-proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    volumes:
      - ./docker/caddy/Caddyfile.local:/etc/caddy/Caddyfile:ro
      - caddy_local_data:/data
      - caddy_local_config:/config
    depends_on:
      app:
        condition: service_healthy
      mercure:
        condition: service_healthy

  app:
    image: devspot-app-dev
    build:
      context: .
      dockerfile: docker/symfony/Dockerfile
    environment:
      APP_ENV: dev
      APP_DEBUG: 1
      APP_SECRET: change_me_in_env_local
      DEFAULT_URI: http://devspot.localhost
      DATABASE_URL: postgresql://app:app@database:5432/app?serverVersion=16&charset=utf8
      MAILER_DSN: smtp://mailer:1025
      MERCURE_URL: http://mercure/.well-known/mercure
      MERCURE_PUBLIC_URL: http://mercure.devspot.localhost/.well-known/mercure
      MERCURE_JWT_SECRET: devspot-mercure-secret
      ML_SERVICE_URL: http://ml:8001
      ML_SERVICE_TIMEOUT: 10
      SYMFONY_TRUSTED_PROXIES: REMOTE_ADDR
      WAIT_FOR_DB: 1
      DB_HOST: database
      DB_PORT: 5432
      DB_USER: app
    depends_on:
      database:
        condition: service_healthy
      mailer:
        condition: service_started
      mercure:
        condition: service_started
      ml:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/healthz"]
      timeout: 5s
      retries: 10
      start_period: 60s

###> doctrine/doctrine-bundle ###
  database:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      # You should definitely change the password in production
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/postgresql/data:rw
      # You may use a bind-mounted host directory instead, so that it is harder to accidentally remove the volume and lose all your data!
      # - ./docker/db/data:/var/lib/postgresql/data:rw
###< doctrine/doctrine-bundle ###

  ml:
    build:
      context: ./ml
    environment:
      CAMEMBERT_DEVICE: cpu
      UVICORN_PORT: 8001
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health').read()"]
      timeout: 5s
      retries: 10
      start_period: 60s

  mailer:
    image: axllent/mailpit
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

###> symfony/mercure-bundle ###
  mercure:
    image: dunglas/mercure
    restart: unless-stopped
    environment:
      SERVER_NAME: ':80'
      MERCURE_PUBLISHER_JWT_KEY: 'devspot-mercure-secret'
      MERCURE_SUBSCRIBER_JWT_KEY: 'devspot-mercure-secret'
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins http://127.0.0.1:8000 http://localhost:8000 http://devspot.localhost
    command: /usr/bin/caddy run --config /etc/caddy/dev.Caddyfile
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/healthz"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - mercure_data:/data
      - mercure_config:/config
###< symfony/mercure-bundle ###

volumes:
###> doctrine/doctrine-bundle ###
  database_data:
###< doctrine/doctrine-bundle ###

  caddy_local_config:
  caddy_local_data:

###> symfony/mercure-bundle ###
  mercure_data:
  mercure_config:
###< symfony/mercure-bundle ###
  huggingface_cache: