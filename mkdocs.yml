site_name: DevSpot Documentation
site_description: Documentation technique, exploitation et recherche du projet DevSpot
site_url: https://mehditrari.github.io/DevSpot/
repo_name: DevSpot
repo_url: https://github.com/MehdiTrari/DevSpot
exclude_docs: |
    README.md
    adr/README.md
    archive/README.md
    matching-human-review-pack.md
    matching-human-review-reranker-vs-baseline.md
    memoire-devspot-draft.md

theme:
  name: material
  language: fr
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js
  - javascripts/mermaid-init.js

nav:
  - Accueil: index.md
  - Vue d'ensemble du dépôt: guide.md
  - Architecture:
      - Vue d'ensemble: architecture/index.md
      - Système & déploiement: architecture/system-overview.md
      - Schéma BDD: architecture/database-schema.md
      - Matching IA: matching-ia-documentation.md
      - Algorithme CamemBERT détaillé: camembert-algorithme-technique.md
      - Analyse méthodologique: analyse-methodologie-matching.md
  - Développement:
      - Vue d'ensemble: dev/index.md
      - Journal d'activité: activity-logs.md
  - Ops:
      - Vue d'ensemble: ops/index.md
      - Déploiement & production: ops/deployment-production.md
      - CI/CD GitHub Actions: ci-cd-github-actions.md
      - Performance US15: problème-performance.md
  - Recherche:
      - Vue d'ensemble: research/index.md
      - Roadmap matching: matching-improvement-roadmap.md
      - Synthèse revue humaine: matching-human-review-summary.md
      - Résultats Phase 4 avant/après: matching-phase4-before-after.md
      - Résumé poster Phase 4: matching-phase4-poster-summary.md
      - Inférence junior-aware: junior-skill-inference-implementation.md
      - Fine-tuning CamemBERT: plan-finetuning-camembert.md
  - ADR:
      - Vue d'ensemble: adr/index.md
      - 0001 Service ML séparé: adr/0001-service-ml-separe.md
      - 0002 Matching hybride: adr/0002-pipeline-matching-hybride.md
      - 0003 Caddy frontal local/prod: adr/0003-caddy-frontal-local-production.md
      - 0004 Matching recruteur anonymisé: adr/0004-matching-recruteur-anonymise.md
      - 0005 Stratégie de tests progressive: adr/0005-strategie-tests-progressive.md
  - Archive:
      - Vue d'ensemble: archive/index.md
