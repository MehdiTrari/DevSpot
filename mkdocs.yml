site_name: DevSpot Documentation
site_description: Documentation technique, exploitation et recherche du projet DevSpot
site_url: https://example.com/devspot-docs
repo_name: DevSpot
repo_url: https://github.com/example/devspot
exclude_docs: |
    README.md
    adr/README.md
    archive/README.md

theme:
  name: material
  language: fr
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Accueil: index.md
  - Vue d'ensemble du dépôt: guide.md
  - Architecture:
      - Vue d'ensemble: architecture/index.md
      - Système & déploiement: architecture/system-overview.md
      - Schema BDD: architecture/database-schema.md
      - Matching IA: matching-ia-documentation.md
  - Développement:
      - Vue d'ensemble: dev/index.md
  - Ops:
      - Vue d'ensemble: ops/index.md
      - Déploiement & production: ops/deployment-production.md
      - CI/CD GitHub Actions: ci-cd-github-actions.md
      - Performance US15: US15-performance.md
  - Recherche:
      - Vue d'ensemble: research/index.md
      - Inférence junior-aware: junior-skill-inference-implementation.md
      - Fine-tuning CamemBERT: plan-finetuning-camembert.md
  - ADR:
      - Vue d'ensemble: adr/index.md
  - Archive:
      - Vue d'ensemble: archive/index.md
